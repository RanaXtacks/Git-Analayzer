version: "3.8"

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: git_analyzer_vllm
    runtime: nvidia
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      --model Qwen/Qwen3-8B
      --max-model-len 8192
      --dtype auto
      --gpu-memory-utilization 0.90
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
